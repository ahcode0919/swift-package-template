name: Swift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Build
      run: SKIP_PLUGINS=1 swift build
    - name: Run tests
      run: SKIP_PLUGINS=1 swift test --enable-code-coverage
    - name: Enforce coverage threshold
      run: |
        THRESHOLD=95
        CODECOV_JSON=$(SKIP_PLUGINS=1 swift test --show-codecov-path)

        COVERAGE=$(jq '
          [.data[0].files[]
            | select(.filename | test("/Tests/|/\\.build/") | not)
            | .summary.lines]
          | (map(.covered) | add) as $covered
          | (map(.count) | add) as $total
          | if $total == 0 then 100 else ($covered * 100 / $total) end
        ' "$CODECOV_JSON")
        echo "Line coverage: ${COVERAGE}% (threshold: ${THRESHOLD}%)"

        if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
          echo "::error::Coverage ${COVERAGE}% is below the ${THRESHOLD}% threshold"
          exit 1
        fi
    - name: Check formatting
      run: make ci-format
    - name: Run Linter
      run: make ci-lint

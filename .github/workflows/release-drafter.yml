name: Release Drafter

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, synchronize, edited ]

permissions:
  contents: read

jobs:
  update_release_draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: read

    steps:
    - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0

  auto_label:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write

    steps:
    - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0

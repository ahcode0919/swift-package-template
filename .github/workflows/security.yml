name: Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  gitleaks:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install gitleaks
      run: |
        ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -sSfL -o "$RUNNER_TEMP/$ARCHIVE" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${ARCHIVE}"
        echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$ARCHIVE" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP" gitleaks
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
    - name: Scan git history for secrets
      run: gitleaks git --redact --verbose

  zizmor:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Audit GitHub Actions workflows
      uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      with:
        # Fail the job on findings instead of uploading to code scanning,
        # which requires a public repo or GitHub Advanced Security
        advanced-security: false

default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "swiftlint"
name = "SwiftLint"
entry = "make ci-lint"
language = "system"
types = ["swift"]
pass_filenames = false

[[repos.hooks]]
id = "gitleaks"
name = "gitleaks"
entry = "gitleaks git --pre-commit --staged --redact --verbose"
language = "system"
pass_filenames = false

[[repos.hooks]]
id = "zizmor"
name = "zizmor"
entry = "zizmor"
language = "system"
files = '^\.github/(workflows/.+\.ya?ml|dependabot\.ya?ml)$'
